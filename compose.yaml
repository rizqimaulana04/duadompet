services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: duadompet
      POSTGRES_PASSWORD: duadompet
      POSTGRES_DB: duadompet
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duadompet"]
      interval: 5s
      retries: 10
volumes:
  postgres:
